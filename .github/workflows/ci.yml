name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # Unity runs only what RUN_TEST() names, so a test can be written, never
      # registered, and never noticed -- the suite stays green and the count
      # still rises (grand review 2026-09-03, correctness-4: one of twelve
      # ArmGate tests had sat unregistered). Runs BEFORE the suite so an orphan
      # is reported even when the tests themselves fail.
      - name: Unity test registration check (defined == RUN_TEST)
        run: ./tools/test_registration_check.sh

      # Two numbers that must agree, checked instead of assumed: the number of
      # RUN_TEST registrations the script above counts, and the number of cases
      # `pio test` actually ran. They agree today (356/356). If the script ever
      # develops a blind spot -- a definition shape it cannot see, a disabled
      # registration it still counts -- this comparison is what notices, because
      # the blind spot would move one number and not the other.
      - name: Native unit tests (case count must match the registration count)
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee /tmp/pio_test.log
          ran="$(grep -oE '[0-9]+ test cases:' /tmp/pio_test.log | tail -1 | grep -oE '^[0-9]+')"
          registered="$(./tools/test_registration_check.sh --print-total)"
          echo "pio test ran '${ran}' case(s); test_registration_check.sh counts '${registered}' registration(s)."
          if [ -z "$ran" ]; then
            echo "::error::could not parse a case count out of the pio test summary -- the"
            echo "::error::output format changed; fix this step rather than dropping the check."
            exit 1
          fi
          if [ "$ran" != "$registered" ]; then
            echo "::error::pio test ran $ran cases but tools/test_registration_check.sh counts"
            echo "::error::$registered RUN_TEST registrations. One of them is wrong: either a test"
            echo "::error::is registered and not running, or the checker cannot see a shape of"
            echo "::error::definition/registration this repo now uses."
            exit 1
          fi

      - name: Build firmware (esp32dev)
        run: pio run -e esp32dev

      - name: Build firmware (Wokwi sim variant)
        run: pio run -e esp32dev_sim

      - name: Build firmware (bench tuning variant)
        run: pio run -e esp32dev_tuning

      # Delivery-image quarantine guard (grand review 2026-09-03, safety-3).
      # platformio.ini's two env comments, CLAUDE.md/AGENTS.md "Delivery vs
      # tuning builds" and ROADMAP D8 all call the "no console, no BT, no sim
      # code in esp32dev" invariant "ELF-verified", but until this step nothing
      # automated verified it -- the evidence was a one-off human `nm`
      # spot-check in D8 Phase 11a (step 7). Runs AFTER all three builds because it needs
      # the two control ELFs: --strict makes a missing control build a failure,
      # so the check can never pass by scanning nothing (exit 4 = VACUOUS).
      - name: Delivery image shape check (no console/BT/sim in esp32dev)
        run: ./tools/delivery_shape_check.sh --strict

  # link2 drift guard (audit R06): lib/link2 + docs/link2_protocol.md are COPIED
  # verbatim into w17-soundlight-fw (the receiver). No submodule keeps them in
  # sync, so this job clones the sibling repo and hands both checkouts to
  # tools/link2_copy_check.sh, which fails ONLY on the four shared CODE files
  # differing (docs/link2_protocol.md is reported, not fatal -- see that
  # script's header and the doc's own "Ownership and the copy" section for why
  # byte-identity is the wrong bar for the doc copy). Both repos are public,
  # so a shallow anonymous clone suffices.
  link2-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sibling repo (link2 contract mirror)
        run: git clone --depth 1 https://github.com/beforethenexttolast/w17-soundlight-fw.git /tmp/sibling
      - name: Verify link2 contract files are identical across repos
        # Delegates to tools/link2_copy_check.sh (the two-tier checker docs/
        # link2_protocol.md's "Ownership and the copy in soundlight-fw" section
        # describes) instead of re-implementing the comparison inline. The four
        # shared CODE files stay FATAL on any difference; docs/link2_protocol.md
        # is REPORTED only, because its canonical copy legitimately carries
        # this-repo-local prose (see that section) that will never match the
        # sibling byte-for-byte. --strict makes an unreachable/missing sibling a
        # hard failure (exit 2) rather than a silent pass, which is correct here
        # since the clone step above guarantees the sibling is present.
        #
        # A reported doc-tier difference does not fail the job -- that exit-code
        # contract is the script's own and stays unchanged here -- but it also
        # should not be invisible on green. If the script's output names a
        # docs/link2_protocol.md difference, surface it as a GitHub Actions
        # warning annotation so a normative divergence (as opposed to
        # this-repo-local prose) still gets a human's attention without
        # turning the job red.
        run: |
          set +e
          output="$(./tools/link2_copy_check.sh --strict --sibling /tmp/sibling)"
          status=$?
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'REPORT -- docs/link2_protocol.md differs'; then
            echo "::warning file=docs/link2_protocol.md::link2-copy-check reports this file differs from the w17-soundlight-fw copy (reported tier, non-fatal). Check by hand for normative drift -- field table, lengths, CRC, the 500 ms staleness rule -- vs. this-repo-local prose; see the job log above for the script's own diff pointer."
          fi
          exit "$status"
