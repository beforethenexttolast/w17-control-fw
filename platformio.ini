; PlatformIO project configuration for the W17 ESP32 #1 "control" firmware.
; See CLAUDE.md for the full hardware/functional brief.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned (matches w17-soundlight-fw): the 7.0.x line is the last platform release
; shipping Arduino core 2.0.17, whose channel-based LEDC API (ledcSetup /
; ledcAttachPin / ledcWrite(channel,...)) the outputs HAL uses. An unpinned bump
; to a core-3.x platform would remove that API and break the build. (audit R02)
platform = espressif32 @ ~7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
; The LDF (chain mode) does not evaluate #ifdef, so main.cpp's flag-gated
; include would otherwise pull btpad_hal_esp32 into EVERY env -- and unlike
; the pure console libs (compiled but never linked, ELF-verified), that lib
; cannot even compile against the stock core (<Bluepad32.h> exists only in
; the BTstack custom core). Ignored here and, by inheritance, in the sim and
; tuning children; env:esp32dev_btshowoff overrides this with an empty list.
; "ELF-verified" is a CI fact, not a memory: tools/delivery_shape_check.sh runs
; the cross `nm` (plus a strings pass) over the built esp32dev ELF on every
; push, with esp32dev_tuning / esp32dev_sim as positive controls so a scanner
; that finds nothing cannot pass silently.
lib_ignore =
    btpad_hal_esp32

; Wokwi simulation build (validation Stage 2): identical to esp32dev plus the
; scripted CRSF self-feeder (src/SimCrsfFeeder.cpp) and a serial status print.
; The ${...} interpolation is mandatory: a child build_flags REPLACES the
; parent's, it does not append. See docs/SIMULATION.md.
[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DW17_SIM_CRSF_FEEDER

; Bench tuning build: adds the serial console + NVS persistence
; (src/main.cpp under -DW17_TUNING_CONSOLE). Opt-in only -- the delivered
; gift firmware builds plain [env:esp32dev] with no UART0 console surface.
[env:esp32dev_tuning]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DW17_TUNING_CONSOLE

; BT show-off PROTOTYPE (docs/bt_showoff_design.md; owner-ratified 2026-08-17,
; never a delivery target). W17_BT_SHOWOFF exists only in the two quarantined
; prototype envs -- THIS one (real Bluepad32 stack, custom core) and
; esp32dev_simbt below (scripted source, stock core); every delivery-lineage
; env (esp32dev / _tuning / _sim) links zero btpad/BT code (ELF-verified
; alongside the console invariant -- tools/delivery_shape_check.sh scans the
; esp32dev ELF for btpad/Bluepad32/BTstack symbols in CI, not just by hand).
;
; OWNER-DECIDED(BT-8), accepted 2026-08-17 and build-proven on this branch --
; the honest wrinkle, stated plainly: this env's framework package is NOT the
; pinned stock 2.0.17 core. It is Bluepad32's lib-builder fork of that same
; IDF 4.4 / core 2.0.x line with BTstack in place of Bluedroid (Bluepad32's
; Arduino integration works by swapping the precompiled core; design §4.3).
; Pinned artifact: 3.10.2 -- the LAST 3.10.x custom-core release that exists
; (bluepad32 3.10.3 was source-only; the lib-builder fork published no 3.10.3
; Arduino-core artifact -- verified against its GitHub releases 2026-08-16).
; The Bluepad32 Arduino API + BTstack ship INSIDE this core package
; (tools/sdk includes + libs), so no separate lib_deps entry exists to drift.
;
; huge_app.csv: BT Classic host+controller code is heavy (design §5 budget);
; this project uses no OTA, so the OTA slot is sacrificed for a ~3MB app
; partition. NVS offset is identical in the stock and huge_app tables, so
; stored tuning survives switching envs (bench-verify once at BT1).
; OWNER-DECIDED(BT-11), accepted 2026-08-17: BTstack license notice owed when
; the repos go public (free for open source; add it to the license file then).
[env:esp32dev_btshowoff]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DW17_BT_SHOWOFF
; Re-enable the wrapper lib here ONLY (an empty value overrides the parent's
; lib_ignore, same replace-not-append semantics as build_flags above).
lib_ignore =
board_build.partitions = huge_app.csv
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/3.10.2/esp32-bluepad32-3.10.2.zip

; BT-head sim (design §7 sim stage; review F2): the SAME W17_BT_SHOWOFF main
; wiring, booted straight into loopBtPad and driven by the scripted
; src/SimPadFeeder.cpp session instead of Bluepad32 -- on the PINNED STOCK
; core, with btpad_hal_esp32 still lib_ignore'd (inherited from the parent):
; this env building at all is the proof that the BT head itself has no
; Bluepad32/BTstack dependency. Session beats (13 s loop, narrated on
; Serial0): awaiting-pad -> connect -> ritual arm -> drive shapes ->
; dropout -> reconnect-claim-only stays Safe -> stream-without-ritual stays
; DISARMED -> fresh ritual -> OPTIONS disarm. Native twin:
; test_full_session_mirrors_sim_pad_feeder_beats in test/test_btpad.
[env:esp32dev_simbt]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DW17_BT_SHOWOFF
    -DW17_SIM_PAD_FEEDER

; Host-side ("no hardware attached") environment for Unity unit tests over the
; pure-logic libs (crsf, failsafe, outputs). Hardware-touching code lives in the
; *_hal_esp32 libs, which are referenced only from src/main.cpp, never from test/.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
test_framework = unity
; Explicit (not relying on a version-specific default): never compile src/main.cpp
; (it includes Arduino.h) into the native test binary.
test_build_src = no
; Belt-and-suspenders: hard-exclude the esp32-only HAL libs from this env's
; Library Dependency Finder, even if something accidentally includes them.
lib_ignore =
    crsf_hal_esp32
    outputs_hal_esp32
    telemetry_hal_esp32
    link2_hal_esp32
    settings_hal_esp32
    console_hal_esp32
    btpad_hal_esp32
